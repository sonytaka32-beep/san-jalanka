name: CI/CD Pipeline - Cloud Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify web files exist
        run: |
          echo "Checking files..."
          ls -la index.html manifest.json sw.js config.xml README.md
          echo "✅ All web files verified"

      - name: Verify GitHub Pages setup
        run: |
          echo "Repository: sonytaka32-beep/san-jalanka"
          echo "Branch: master/main"
          echo "Workflow: CI/CD Pipeline active"

      - name: Success notification
        run: |
          echo "✅ Build workflow completed successfully"
          echo "Files ready for download from GitHub Repository"